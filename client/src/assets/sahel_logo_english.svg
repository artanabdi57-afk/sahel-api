<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 130" width="480" height="130">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#2563EB"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <rect x="8" y="8" width="114" height="114" rx="28" fill="url(#iconGrad)"/>
  <circle cx="65" cy="58" r="34" fill="#FFFFFF" opacity="0.08"/>
  <rect x="26" y="82" width="18" height="24" rx="9" fill="#FFFFFF" opacity="0.5"/>
  <rect x="52" y="64" width="18" height="42" rx="9" fill="#FFFFFF" opacity="0.75"/>
  <rect x="78" y="44" width="18" height="62" rx="9" fill="#FFFFFF"/>
  <circle cx="96" cy="30" r="8" fill="url(#dotGrad)" opacity="0.9"/>

  <!-- Wordmark -->
  <text x="142" y="66"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="46" font-weight="700" fill="#1E3A6E" letter-spacing="-0.5">sahel</text>

  <!-- Underline -->
  <rect x="142" y="74" width="170" height="4" rx="2" fill="#93C5FD" opacity="0.6"/>

  <!-- English tagline only -->
  <text x="144" y="104"
    font-family="'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="500" fill="#2563EB" letter-spacing="1">
    Your Gateway to Smart Business
  </text>

</svg>
